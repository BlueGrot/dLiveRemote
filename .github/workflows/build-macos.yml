name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version && xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./Scripts/make-app.sh

      - name: Zip app
        run: cd build && ditto -c -k --keepParent DLiveRemote.app DLiveRemote.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: DLiveRemote-macOS
          path: build/DLiveRemote.zip
